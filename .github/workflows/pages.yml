name: Deploy catalog to Pages

on:
  push:
    branches:
      - master
      - feat/catalog-site      # <-- LIGNE DE TEST : a retirer avant la PR upstream
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet -> date "mis a jour" par snippet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Regenerer le catalogue
        run: npm run build:catalog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
